<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğretmen Takip Paneli - Canlı Kontrol v4</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OverlappingMarkerSpiderfier-Leaflet/0.2.6/oms.min.js"></script>

    <style>
        :root { --safe: #2ecc71; --danger: #e74c3c; --offline: #95a5a6; --dark: #2c3e50; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 320px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 2000; }
        .sidebar-header { padding: 15px; background: var(--dark); color: white; }
        
        .refresh-btn { 
            width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 5px; 
            background: #3498db; color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .refresh-btn:hover { background: #2980b9; }

        .student-list { flex: 1; overflow-y: auto; padding: 10px; }
        .student-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; margin-bottom: 5px; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
        .dot-green { background: var(--safe); }
        .dot-red { background: var(--danger); }
        .dot-offline { background: var(--offline); }

        .main-content { flex: 1; position: relative; display: flex; flex-direction: column; }
        #map { flex: 1; }
        
        .dashboard-mini { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--dark); color: white; padding: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h3 style="margin:0">Öğrenci Listesi</h3>
        <button class="refresh-btn" onclick="location.reload()">🔄 Verileri Yenile</button>
    </div>
    <div class="student-list" id="listContent"></div>
</div>

<div class="main-content">
    <div id="map"></div>
    <div class="dashboard-mini">
        <div class="stat-box">Toplam<span id="tCount">0</span></div>
        <div class="stat-box green">İçerde<span id="gCount">0</span></div>
        <div class="stat-box red">Dışarda<span id="rCount">0</span></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBpGeBTfFljxxza0WP50SeAqH88mx-0kpk",
        authDomain: "trip-followup.firebaseapp.com",
        databaseURL: "https://trip-followup-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "trip-followup",
        storageBucket: "trip-followup.firebasestorage.app",
        messagingSenderId: "377252304572",
        appId: "1:377252304572:web:20b40a5d305e92b00022b9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const map = L.map('map').setView([36.8985, 30.7930], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let busPos = null;
    const safeRadius = 100;
    const timeoutLimit = 120000; // 2 Dakika (milisaniye)
    let safeCircle, teacherMarker, markers = {};
    const oms = new OverlappingMarkerSpiderfier(map, { keepSpiderfied: true });

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
            busPos = [pos.coords.latitude, pos.coords.longitude];
            if (!safeCircle) {
                map.setView(busPos, 17);
                safeCircle = L.circle(busPos, { radius: safeRadius, color: '#3498db', fillOpacity: 0.15 }).addTo(map);
                teacherMarker = L.marker(busPos, { zIndexOffset: 1000 }).addTo(map).bindPopup("Siz");
                syncStudents();
            } else {
                safeCircle.setLatLng(busPos);
                teacherMarker.setLatLng(busPos);
            }
        }, null, { enableHighAccuracy: true });
    }

    function syncStudents() {
        db.ref('students').on('value', (snapshot) => {
            const data = snapshot.val();
            const now = Date.now();
            let g = 0, r = 0, total = 0, listHtml = "";

            // Önce mevcut tüm markerları temizle (pasifleri ayıklamak için)
            Object.keys(markers).forEach(id => {
                if (!data || !data[id]) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            });

            for (let id in data) {
                const s = data[id];
                const lastSeen = s.timestamp || now; // Timestamp yoksa şimdiyi al
                const isOffline = (now - lastSeen) > timeoutLimit;
                
                if (isOffline) {
                    // Çevrimdışı öğrenciyi haritadan kaldır
                    if (markers[id]) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                    listHtml += `<div class="student-item"><div class="status-dot dot-offline"></div><div><b>${s.name}</b><br><small>Çevrimdışı (Kapalı)</small></div></div>`;
                    continue; 
                }

                total++;
                const dist = Math.round(map.distance([s.lat, s.lng], busPos));
                const isSafe = dist <= safeRadius;
                isSafe ? g++ : r++;
                
                const dotClass = isSafe ? 'dot-green' : 'dot-red';
                const color = isSafe ? '#2ecc71' : '#e74c3c';

                listHtml += `<div class="student-item"><div class="status-dot ${dotClass}"></div><div><b>${s.name}</b><br><small>${dist}m uzakta</small></div></div>`;

                if (markers[id]) {
                    markers[id].setLatLng([s.lat, s.lng]);
                    markers[id].getElement().querySelector('div').style.background = color;
                } else {
                    const icon = L.divIcon({
                        className: 'm-icon',
                        html: `<div style="background:${color}; width:14px; height:14px; border-radius:50%; border:2px solid white;"></div>`
                    });
                    const m = L.marker([s.lat, s.lng], { icon: icon }).addTo(map).bindPopup(s.name);
                    oms.addMarker(m);
                    markers[id] = m;
                }
            }

            document.getElementById('listContent').innerHTML = listHtml;
            document.getElementById('tCount').innerText = total;
            document.getElementById('gCount').innerText = g;
            document.getElementById('rCount').innerText = r;
        });
    }
</script>
</body>
</html>
